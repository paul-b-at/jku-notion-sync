name: Calendar mirror checks

on:
  pull_request:
    paths:
      - 'apps-script/lecture-mirror/**'
      - '.github/workflows/calendar-mirror-check.yml'
  push:
    paths:
      - 'apps-script/lecture-mirror/**'
      - '.github/workflows/calendar-mirror-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Apps Script syntax
        run: node --check < apps-script/lecture-mirror/Code.gs
      - name: Test without live Google access
        run: node --test apps-script/lecture-mirror/verify.cjs
